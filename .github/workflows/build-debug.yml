name: build-debug

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      # 内嵌 Rust 后端（neteasy-backend）不入库，构建前下载并校验 SHA-256。
      # 升级后端：改 gradle.properties 的 neteasy.backendVersion 时，这里两处一起改。
      - name: 下载内嵌 Rust 后端（三 ABI）
        run: |
          set -euo pipefail
          BASE="https://github.com/42419/neteasy-backend/releases/download/v0.5.0"
          DEST="android/app/src/main/jniLibs"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$DEST/$abi"
            curl -fsSL --retry 3 -o "$DEST/$abi/libneteasy_backend.so" \
              "$BASE/libneteasy_backend-$abi.so"
          done
          cd "$DEST"
          cat > /tmp/SHA256SUMS <<'EOF'
          b8ff4960712972fa243f117a3eb472532261d179ad45b194935992faecc99822  arm64-v8a/libneteasy_backend.so
          5793e0c2065619d0c514bd84aff8de4d503eee3edc4ed78b3321dbfb4816547f  armeabi-v7a/libneteasy_backend.so
          60efbef8c31ed3dfe505a698433e1105fd4f15b3b01d6134eb3d455e6c887b0b  x86_64/libneteasy_backend.so
          EOF
          sha256sum -c /tmp/SHA256SUMS

      - name: 依赖与静态检查
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # 只出 arm64：debug 引擎每个 ABI 30~37MB，三 ABI 会让 APK 到 162MB。
      # 需要模拟器（x86_64）时把 --target-platform 换成 "android-arm64,android-x64"。
      - name: 构建 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: neteasy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
