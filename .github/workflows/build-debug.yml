name: build-debug

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      # 内嵌 Rust 后端（neteasy-backend）不入库，构建前下载并校验 SHA-256。
      # 升级后端：改 gradle.properties 的 neteasy.backendVersion 时，这里两处一起改。
      - name: 下载内嵌 Rust 后端（三 ABI）
        run: |
          set -euo pipefail
          BASE="https://github.com/42419/neteasy-backend/releases/download/v0.2.0"
          DEST="android/app/src/main/jniLibs"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$DEST/$abi"
            curl -fsSL --retry 3 -o "$DEST/$abi/libneteasy_backend.so" \
              "$BASE/libneteasy_backend-$abi.so"
          done
          cd "$DEST"
          cat > /tmp/SHA256SUMS <<'EOF'
          b844d20971d959fee43a5998fd547d556e40179018a2b2d8364925314fc8f28c  arm64-v8a/libneteasy_backend.so
          9bfc909624f4c9d786f840bced7f7a0c316674fde52727f1d5ef526259d371bb  armeabi-v7a/libneteasy_backend.so
          32927a9aa3417b8dc13ded6e950500c57ba49c4e6f8c045ddfd6a6179bc4639b  x86_64/libneteasy_backend.so
          EOF
          sha256sum -c /tmp/SHA256SUMS

      - name: 依赖与静态检查
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: 构建 debug APK
        run: flutter build apk --debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: neteasy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
