name: build-debug

on:
  # 只手动触发：这是装机用的 debug APK，不是每次提交都要出的产物，
  # 跟着 push 跑太频繁。需要包时在 Actions 页面点 Run workflow。
  workflow_dispatch:

concurrency:
  group: build-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      # 内嵌 Rust 后端（neteasy-backend）不入库，构建前下载并校验 SHA-256。
      - name: 下载内嵌 Rust 后端（三 ABI）
        run: |
          set -euo pipefail
          BASE="https://github.com/42419/neteasy-backend/releases/download/v0.7.0"
          DEST="android/app/src/main/jniLibs"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "$DEST/$abi"
            curl -fsSL --retry 3 -o "$DEST/$abi/libneteasy_backend.so" \
              "$BASE/libneteasy_backend-$abi.so"
          done
          cd "$DEST"
          cat > /tmp/SHA256SUMS <<'EOF'
          23cd799a1cdda07a8825ef035530f5bdcaa22e0cbba8b1d16513c213998511ec  arm64-v8a/libneteasy_backend.so
          023e8e84958814de96a128023cac9188dcc881954c1362f2e15bbba238bf6e98  armeabi-v7a/libneteasy_backend.so
          07881d2b009439ee140260d25b611a5062d903e4f2f156341e5ef2df1bd0bf24  x86_64/libneteasy_backend.so
          EOF
          sha256sum -c /tmp/SHA256SUMS

      - name: 依赖与静态检查
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # 只出 arm64：debug 引擎每个 ABI 30~37MB，三 ABI 会让 APK 到 162MB。
      # 需要模拟器（x86_64）时把 --target-platform 换成 "android-arm64,android-x64"。
      - name: 构建 debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: neteasy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
